<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="globe1" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0369a1" flood-opacity="0.3"/>
    </filter>
    <filter id="wshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <clipPath id="clip1">
      <circle cx="88" cy="100" r="62"/>
    </clipPath>
  </defs>

  <!-- Globe -->
  <circle cx="88" cy="100" r="62" fill="url(#globe1)" filter="url(#shadow1)"/>

  <!-- Continents stylisés -->
  <g clip-path="url(#clip1)" fill="#10b981" opacity="0.85">
    <ellipse cx="75" cy="85" rx="18" ry="26" transform="rotate(-15 75 85)"/>
    <ellipse cx="105" cy="110" rx="14" ry="18" transform="rotate(10 105 110)"/>
    <ellipse cx="62" cy="115" rx="8" ry="10" transform="rotate(-5 62 115)"/>
    <ellipse cx="115" cy="82" rx="9" ry="6" transform="rotate(20 115 82)"/>
  </g>

  <!-- Lignes du globe -->
  <g clip-path="url(#clip1)" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2">
    <ellipse cx="88" cy="100" rx="62" ry="22"/>
    <line x1="88" y1="38" x2="88" y2="162"/>
  </g>

  <!-- Halo lumineux -->
  <circle cx="88" cy="100" r="62" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Bulle de dialogue -->
  <rect x="105" y="22" width="62" height="50" rx="14" fill="white" filter="url(#wshadow)"/>
  <polygon points="112,72 125,72 118,85" fill="white"/>

  <!-- Point d'interrogation -->
  <text x="136" y="57" font-size="30" font-weight="800" fill="#0369a1"
        text-anchor="middle" font-family="Georgia, serif">?</text>
</svg>
