[build]
  publish = "dist"
  command = "npm run build"

# Proxy TTS : route /api/tts vers la Netlify Function qui appelle ElevenLabs
# La clé ELEVENLABS_API_KEY reste côté serveur, jamais exposée dans le bundle JS.
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200
  force = true

# Proxy Tatoeba : redirige /tatoeba-api/* vers l'API Tatoeba côté serveur,
# ce qui évite les restrictions CORS dans le navigateur.
[[redirects]]
  from = "/tatoeba-api/*"
  to = "https://api.dev.tatoeba.org/:splat"
  status = 200
  force = true
